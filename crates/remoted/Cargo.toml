[package]
name = "remoted"
version = "0.1.0"
edition = "2021"
description = "Turns BLE remotes that send keys as GATT notifications into a Linux keyboard (uinput)"
license = "GPL-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
libc = "0.2"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
