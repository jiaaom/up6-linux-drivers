# t6-fand configuration. Temperatures in °C, duties in percent.
#
# Profiles: silent | balance | performance (built-in presets) and custom
# (editable in T6 Control Center). The active profile is `profile`
# below unless /run/t6-fand/profile names another one. Reload with SIGHUP.
#
# Measured on the T6: every fan runs linearly down to ~6 % and stops at 4 %;
# from standstill the bay 1-2 fan needs 10 % to start, the others 8 %. A
# curve value of 0 stops the fan; it restarts with `start_pwm` for
# `kick_secs`, then runs no lower than `min_pwm`. `tau_secs` low-pass
# filters the temperature (MacBook-style: react to sustained heat, not
# spikes). Meteor Lake turbos straight to its 100 °C limit under any load
# and throttles itself there, so the emergency path only engages once
# `emergency_temp` has been sustained for `emergency_secs`, and then ramps
# at `emergency_ramp` %/s rather than jumping.

interval_secs = 1
profile = "balance"
failsafe_pwm = 70          # applied when a zone has no readable sensor, and on exit
fan_hwmon = "t6_ec"

# CPU heatsink fan: 8 % ≈ 470 rpm, 25 % ≈ 1450, 50 % ≈ 2520, 100 % ≈ 3400.
# The Xe tile shares the package, the RAPL envelope and the heatsink but has
# its own sensor (i915 temp1); the zone follows the hotter of the two.
[zones.cpu]
fan = "CPU fan"
sensors = ["coretemp/Package id 0", "i915/temp1"]
tau_secs = 12
emergency_temp = 95
emergency_secs = 10
emergency_ramp = 12
hysteresis = 4
ramp_up = 3
ramp_down = 1.5
min_pwm = 8
start_pwm = 12
kick_secs = 3
# Curves derived from the measured plant (docs/t6-fand-measurements.md,
# 2026-09-18): package °C ≈ a(duty) + R(duty) × package W, with R falling from
# 1.16 K/W at 8 % to 0.65 K/W at 100 % and little gained above ~35 %. Each
# profile is a sustained-temperature cap plus an idle floor; a PL2 burst peaks
# ~23 °C above the temperature it starts from whatever the fan does, so the
# idle floor is what limits burst throttling and the cap what limits
# sustained load. Steady state at 8 / 28 W on the measured plant:
#   silent      cap 78 °C, idle 8 %:   57 °C @ 470 rpm  /  78 °C @ 1360 rpm
#   balance     cap 68 °C, idle 8 %:   57 °C @ 470 rpm  /  69 °C @ 1960 rpm
#   performance cap 60 °C, idle 25 %:  55 °C @ 1490 rpm /  62 °C @ 2980 rpm
[zones.cpu.curves]
silent      = [[50, 0], [54, 8], [70, 8], [75, 14], [78, 24], [84, 50], [92, 100]]
balance     = [[46, 0], [50, 8], [62, 8], [66, 18], [68, 30], [71, 42], [78, 70], [88, 100]]
performance = [[40, 25], [55, 25], [58, 32], [60, 45], [62, 65], [66, 100]]

# Small fan over NVMe bays 1–2: 10 % ≈ 1050 rpm, 25 % ≈ 2700, 50 % ≈ 4640, 100 % ≈ 6400.
# Bays are resolved through their PCIe root ports; empty bays are ignored.
custom      = [[46, 0], [50, 8], [62, 8], [66, 18], [68, 30], [71, 42], [78, 70], [88, 100]]
[zones.ssd12]
fan = "SSD bay 1-2 fan"
sensors = ["bay/1", "bay/2"]
tau_secs = 20
emergency_temp = 70
hysteresis = 3
ramp_up = 2
ramp_down = 1
min_pwm = 8
start_pwm = 12
kick_secs = 3
[zones.ssd12.curves]
silent      = [[42, 0], [46, 8], [55, 18], [62, 40], [68, 70], [75, 100]]
balance     = [[38, 0], [42, 8], [50, 20], [58, 40], [65, 70], [72, 100]]
performance = [[30, 10], [45, 30], [55, 60], [65, 100]]

# Small fan over NVMe bays 3–6.
custom      = [[38, 0], [42, 8], [50, 20], [58, 40], [65, 70], [72, 100]]
[zones.ssd36]
fan = "SSD bay 3-6 fan"
sensors = ["bay/3", "bay/4", "bay/5", "bay/6"]
tau_secs = 20
emergency_temp = 70
hysteresis = 3
ramp_up = 2
ramp_down = 1
min_pwm = 8
start_pwm = 12
kick_secs = 3
[zones.ssd36.curves]
silent      = [[42, 0], [46, 8], [55, 18], [62, 40], [68, 70], [75, 100]]
balance     = [[38, 0], [42, 8], [50, 20], [58, 40], [65, 70], [72, 100]]
performance = [[30, 10], [45, 30], [55, 60], [65, 100]]

custom      = [[38, 0], [42, 8], [50, 20], [58, 40], [65, 70], [72, 100]]