# Installed by the T6 Control package (removed on uninstall).
# Turns on NetworkManager's connectivity check, so a network that is
# connected but held behind a sign-in page (hotel, café) or without internet
# shows as such: the Wi-Fi light turns yellow and the front panel says so.
# Apple's probe page answers everywhere, mainland China included.
[connectivity]
enabled=true
uri=http://captive.apple.com/hotspot-detect.html
response=<HTML><HEAD><TITLE>Success</TITLE></HEAD><BODY>Success</BODY></HTML>
interval=60
