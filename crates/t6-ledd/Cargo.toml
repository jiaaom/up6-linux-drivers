[package]
name = "t6-ledd"
version = "0.1.0"
edition = "2021"
description = "Indicator daemon for UnifyDrive UP6/T6: LEDs, beeper"
license = "GPL-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
signal-hook = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
