# t6-ledd configuration. Managed by t6-ledd (T6 Control Center);
# hand edits are kept but reformatted on the next change.
#
# bays_enabled  master switch for the six bay LEDs
# [night]       manual = true forces night mode; schedule = "23:00-07:00"
# wifi_hotspot  show the Wi-Fi hotspot heartbeat
# [devices.<id>] mode = "auto" | "manual", color = "<name>" for manual;
#   wifi and bt also take "quiet" (dark while working normally)
#   ids: power, bay1..bay6, rgb, bt, wifi (battery is always automatic)

bays_enabled = true
wifi_hotspot = true

[night]
manual = false

[devices.bt]
mode = "quiet"

[devices.wifi]
mode = "quiet"
