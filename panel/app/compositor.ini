# The front panel's fragment for appliance-compositor, installed as
# /etc/appliance-compositor/clients.d/t6-panel.ini (see the compositor's
# docs/CONTRACT.md: only [output] and [appliance-rule] sections).
#
# Scales the built-in touch panel's output 2x: the panel is ~403 PPI (1080x2160
# on a ~6.8x13.6cm screen), well past the ~96-160 PPI most UI toolkits assume,
# so unscaled everything (our own app, and anything embedded in it, like fnOS's
# Preview) renders too small to comfortably tap. Wayland-aware clients (GTK, Qt,
# Chromium/Electron via --ozone-platform=wayland) query this and render crisp,
# correctly-sized native content themselves — this is the standard "Retina"
# mechanism, not a per-app hack. See refs/linux-wayland-dpi.md for the full
# investigation (including why our own app's design had to change to benefit
# from it, and why per-app CSS zoom is NOT equivalent to this).
#
# Scoped to the built-in screen by name (HDMI-A-1, behind the IT6616 bridge),
# so a TV on the rear HDMI port (HDMI-A-2) keeps its own settings.
[output]
name=HDMI-A-1
scale=2

# Stacking (appliance-shell rules). The panel UI is the bottom layer; the
# video player (bundled mpv, app-id "mpv") opens above it and the panel is on
# top again when it exits. All three windows belong on the built-in screen.
[appliance-rule]
app-id=t6-panel
layer=0
output=HDMI-A-1

[appliance-rule]
app-id=mpv
layer=10
output=HDMI-A-1

# Screensaver (appliance-screensaver, run by t6-paneld while the screen is
# dark, with this app-id): above everything on the built-in screen, so it
# alone gets keys and touches there.
[appliance-rule]
app-id=t6-panel-screensaver
layer=100
output=HDMI-A-1
