# WirePlumber rules for the T6 panel's sound server (t6-audio-session, which
# reads this dir via XDG_CONFIG_HOME; see packaging/fpk/t6-panel/cmd/common).

monitor.alsa.rules = [
  # ALSA card "pcsp" is the PC speaker (the board's beeper), which the ALSA
  # monitor would otherwise offer as "Built-in Audio" output; playing a film
  # into it just screeches.
  {
    matches = [ { device.name = "alsa_card.platform-pcspkr" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
