# The panel's built-in video player (bundled mpv, launched by the kiosk; see
# panel/mpv/README.md). Runs on the panel's weston under
# appliance-compositor, which keeps it fullscreen above the panel UI.

vo=gpu
gpu-context=wayland
# Zero-copy VAAPI: frames stay on the GPU from decoder to screen. (vaapi-copy
# reads every frame back to RAM and manages only ~17 fps at 4K HDR.) Needs the
# bundled libva 2.23 incl. libva-wayland (see run-mpv.sh). mpv falls back to
# software decoding by itself if VAAPI is unavailable.
hwdec=vaapi
# mpv 0.35 commits its first frame at the video's own size, which libweston
# rejects for a fullscreen window (protocol error). Start at the panel's size.
geometry=1080x2160

# Music too: open the window (and so the controls) even when there is no
# video; embedded cover art, if any, is shown as the picture.
force-window=yes

# uosc draws the controls (touch-sized, see script-opts/uosc.conf)
osc=no
osd-bar=no
border=no
cursor-autohide=3000

# Audio goes to PipeWire's default output (appliance-compositor's PipeWire; chosen in the panel's
# Settings → Audio). Volume: config/scripts/t6_prefs.lua.
ao=pipewire

# Back to the file browser when the video ends, like a phone player.
keep-open=no

# Subtitles: pick up external files next to the video (movie.srt,
# movie.zh.ass, ...); prefer Chinese, then English.
sub-auto=fuzzy
slang=chi,zho,zh,chs,cht,eng,en
sub-font=Noto Sans CJK SC
