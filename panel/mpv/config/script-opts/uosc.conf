# Touch-sized controls. mpv 0.35 does not see the shell's fullscreen state, so
# `scale` applies (on top of weston's 2x output scale); set both.
scale=2
scale_fullscreen=2
controls=menu,gap,<video,audio>subtitles,<has_many_audio>audio,audio-device,gap,space,<video,audio>speed,space,command:screen_rotation:script-message-to ash_rotate rotate?Rotate
controls_size=32
timeline_size=40
volume=right
autohide=yes
top_bar=always
top_bar_controls=right
proximity_in=60
proximity_out=160
