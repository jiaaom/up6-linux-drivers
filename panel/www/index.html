<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<!-- laid out at 390 x 780 CSS px; the kiosk zooms it to the screen (panel/app/main.js) -->
<meta name="t6-layout-width" content="390">
<title>T6 Panel</title>
<script>
  // Paint the first frame in the chosen theme and language (echoes of
  // settings.json; js/core/theme.js and i18n.js keep them in sync).
  (function () {
    function load(k) { try { return JSON.parse(localStorage.getItem('t6ui.' + k)); } catch (e) { return null; } }
    if (load('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
    if (load('lang') === 'en') document.documentElement.lang = 'en';
  })();
</script>
<link rel="preload" href="ridgeline/1.13.3/fonts/SourceSans3-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="ridgeline/1.13.3/fonts/HuiwenMinchoGBK-GB2312.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="ridgeline/1.13.3/tokens.css">
<link rel="stylesheet" href="ridgeline/1.13.3/bundle.css">
<link rel="stylesheet" href="css/app.css">
<script src="ridgeline/1.13.3/Backdrop/liuli-glass.js" defer></script>  <!-- window.RidgelineGlass, for js/shell/glass.js -->
<script src="vendor/qrcode-generator-1.4.4/qrcode.js" defer></script>  <!-- window.qrcode, for js/ui/qr.js -->
<script type="module" src="js/main.js"></script>
</head>
<body>
<div id="app" class="rl-screen rl-backdrop--fixed rl-silk rl-color-icons"></div>
</body>
</html>
