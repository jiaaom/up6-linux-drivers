[package]
name = "t6-fand"
version = "0.1.0"
edition = "2021"
description = "Fan policy daemon for the ZSpace T6 NAS (hwmon-based)"
license = "GPL-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
signal-hook = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
