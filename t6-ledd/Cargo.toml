[package]
name = "t6-ledd"
version = "0.1.0"
edition = "2021"
description = "Indicator daemon for the ZSpace T6 NAS: LEDs, night mode, beeper"
license = "GPL-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
signal-hook = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
