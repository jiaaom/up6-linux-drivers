# Example: a touch front panel whose main UI is an Electron app (app-id
# "t6-panel"), with a video player and a translucent control overlay that
# can be put on top of it.

[core]
shell=appliance-shell.so

[output]
name=HDMI-A-1
scale=2

[shell]
background-color=0xff000000

[appliance-shell]
# default: $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY.appliance-shell ; "none" disables
#control-socket=/run/user/0/panel.appliance-shell

# The main UI: bottom layer.
[appliance-rule]
app-id=t6-panel
layer=0

# A native player opened on demand: above the UI.
[appliance-rule]
app-id=mpv
layer=10

# Translucent controls drawn over the player; never steals keyboard focus.
[appliance-rule]
app-id=player-controls
layer=20
focusable=false

# Something that always lives on the rear HDMI port, rotated.
#[appliance-rule]
#app-id=tv-ui
#output=HDMI-A-2
#rotation=0
